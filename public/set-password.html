<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password - Health Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: system-ui, sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-100 text-indigo-600 mb-3">
        <i class="fas fa-key text-xl"></i>
      </div>
      <h1 class="text-xl font-bold text-gray-800">Set Your Password</h1>
      <p class="text-gray-500 text-sm mt-1">Choose a new password for your Health Portal account</p>
    </div>

    <div id="noToken" class="hidden text-center text-red-600 text-sm py-4">
      No reset link found. Use the link from your welcome email, or ask admin to resend.
    </div>

    <form id="form" class="hidden space-y-4">
      <input type="hidden" id="token" name="token" value="">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">New password (min 6 characters)</label>
        <input type="password" id="newPassword" name="newPassword" required minlength="6"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          placeholder="Enter new password" autocomplete="new-password">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          placeholder="Confirm new password" autocomplete="new-password">
      </div>
      <div id="formError" class="text-red-600 text-sm hidden"></div>
      <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">
        Set Password
      </button>
    </form>

    <div id="success" class="hidden text-center py-4">
      <p class="text-green-600 font-medium mb-2"><i class="fas fa-check-circle mr-1"></i> Password set successfully.</p>
      <p class="text-gray-600 text-sm mb-4">You can now sign in with your new password.</p>
      <a href="/" class="inline-block text-indigo-600 font-medium">Go to login</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('form');
    const noToken = document.getElementById('noToken');
    const success = document.getElementById('success');
    const formError = document.getElementById('formError');

    if (!token) {
      noToken.classList.remove('hidden');
    } else {
      form.classList.remove('hidden');
      document.getElementById('token').value = token;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      formError.classList.add('hidden');
      if (newPassword !== confirmPassword) {
        formError.textContent = 'Passwords do not match';
        formError.classList.remove('hidden');
        return;
      }
      if (newPassword.length < 6) {
        formError.textContent = 'Password must be at least 6 characters';
        formError.classList.remove('hidden');
        return;
      }
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Setting...';
      try {
        const res = await fetch('/api/auth/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        if (res.ok) {
          form.classList.add('hidden');
          success.classList.remove('hidden');
        } else {
          formError.textContent = data.msg || 'Failed to set password';
          formError.classList.remove('hidden');
        }
      } catch (err) {
        formError.textContent = 'Network error. Try again.';
        formError.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set Password';
      }
    });
  </script>
</body>
</html>
