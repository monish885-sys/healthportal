<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Health Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .login-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .login-card:hover { box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2); }
    .input-focus:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2); }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .nav-link:hover { color: #667eea; }
    .demo-box { background: linear-gradient(135deg, #f0f4ff 0%, #faf0ff 100%); border: 1px solid #e0e7ff; }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Back button -->
    <a href="/" class="inline-flex items-center text-white text-opacity-90 hover:text-white mb-6 transition-colors">
      <i class="fas fa-arrow-left mr-2"></i> Back to Home
    </a>

    <!-- Card -->
    <div class="login-card rounded-2xl p-8">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4">
          <i class="fas fa-user-shield text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Admin Portal</h1>
        <p class="text-gray-500 text-sm mt-1">Sign in to manage the health portal</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-envelope mr-2 text-indigo-500 w-4"></i>Email</label>
          <input type="email" id="email" name="email" required
            class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg outline-none transition-all"
            placeholder="admin@healthportal.com" autocomplete="email">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-lock mr-2 text-indigo-500 w-4"></i>Password</label>
          <div class="relative">
            <input type="password" id="password" name="password" required
              class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg outline-none transition-all pr-10"
              placeholder="••••••••" autocomplete="current-password">
            <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <i class="fas fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" id="submitBtn" class="btn-primary w-full text-white font-semibold py-3 rounded-lg flex items-center justify-center gap-2 transition-all">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <div id="loginMessage" class="mt-4 text-center text-sm hidden"></div>

      <!-- Demo credentials -->
      <div class="demo-box rounded-lg p-4 mt-4">
        <p class="text-xs font-semibold text-indigo-700 mb-2"><i class="fas fa-key mr-1"></i> Demo credentials</p>
        <p class="text-sm text-gray-700"><strong>Admin:</strong> admin@healthportal.com / admin123</p>
      </div>

      <!-- Quick navigation -->
      <div class="flex flex-wrap justify-center gap-3 mt-6 pt-6 border-t border-gray-200 text-sm">
        <a href="/" class="nav-link text-gray-500"><i class="fas fa-home mr-1"></i>Home</a>
        <a href="/doctor-login" class="nav-link text-gray-500"><i class="fas fa-user-md mr-1"></i>Doctor</a>
        <a href="/patient-login" class="nav-link text-gray-500"><i class="fas fa-user-injured mr-1"></i>Patient</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('loginMessage');
    const submitBtn = document.getElementById('submitBtn');
    const togglePassword = document.getElementById('togglePassword');
    const toggleIcon = document.getElementById('toggleIcon');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.classList.toggle('fa-eye', !isPassword);
      toggleIcon.classList.toggle('fa-eye-slash', isPassword);
    });

    function showMessage(text, success) {
      message.textContent = text;
      message.className = 'mt-4 text-center text-sm ' + (success ? 'text-green-600' : 'text-red-600');
      message.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const originalHtml = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      submitBtn.disabled = true;
      message.classList.add('hidden');

      const data = { email: form.email.value, password: form.password.value };
      try {
        const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const result = await res.json();
        if (res.ok) {
          showMessage('Login successful! Redirecting...', true);
          setTimeout(() => { window.location.href = '/admin'; }, 1200);
        } else {
          showMessage(result.msg || 'Login failed. Check your credentials.', false);
        }
      } catch (err) {
        showMessage('Network error. Please try again.', false);
      } finally {
        submitBtn.innerHTML = originalHtml;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
